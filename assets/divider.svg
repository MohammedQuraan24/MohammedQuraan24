<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 24" width="800" height="24" role="img" aria-label="decorative divider">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0"/>
      <stop offset="28%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#ff2bd6"/>
      <stop offset="72%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <line x1="10" y1="12" x2="790" y2="12" stroke="url(#grad)" stroke-width="2" filter="url(#g)"/>
  <circle cx="400" cy="12" r="3.5" fill="#ff2bd6" filter="url(#g)">
    <animate attributeName="r" values="3.5;6;3.5" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.55;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="290" cy="12" r="2" fill="#00f5ff" opacity="0.8"/>
  <circle cx="510" cy="12" r="2" fill="#8b5cf6" opacity="0.8"/>
</svg>
