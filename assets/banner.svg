<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Mohammed Quraan developer banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14">
        <animate attributeName="stop-color" values="#070b14;#0d1526;#070b14" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0e18">
        <animate attributeName="stop-color" values="#0a0e18;#141026;#0a0e18" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5ff">
        <animate attributeName="stop-color" values="#00f5ff;#ff2bd6;#8b5cf6;#00f5ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#ff2bd6">
        <animate attributeName="stop-color" values="#ff2bd6;#8b5cf6;#00f5ff;#ff2bd6" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#00f5ff;#ff2bd6;#8b5cf6" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff2bd6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1f6f8b" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- ambient glow blobs -->
  <circle cx="150" cy="90" r="130" fill="#00f5ff" opacity="0.07" filter="url(#glow)">
    <animate attributeName="cx" values="150;210;150" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1040" cy="240" r="150" fill="#ff2bd6" opacity="0.07" filter="url(#glow)">
    <animate attributeName="cy" values="240;180;240" dur="16s" repeatCount="indefinite"/>
  </circle>

  <!-- corner frame -->
  <rect x="22" y="22" width="1156" height="276" rx="14" fill="none" stroke="#00f5ff" stroke-opacity="0.28" stroke-width="1.5"/>
  <path d="M22 70V36q0-14 14-14h34" fill="none" stroke="#00f5ff" stroke-width="3" filter="url(#softGlow)"/>
  <path d="M1178 250v34q0 14-14 14h-34" fill="none" stroke="#ff2bd6" stroke-width="3" filter="url(#softGlow)"/>

  <!-- top scan line -->
  <line x1="60" y1="60" x2="1140" y2="60" stroke="url(#line)" stroke-width="1.5">
    <animate attributeName="y1" values="60;280;60" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="60;280;60" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="9s" repeatCount="indefinite"/>
  </line>

  <!-- greeting -->
  <text x="600" y="112" text-anchor="middle" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="20" font-weight="500" letter-spacing="7" fill="#8b98ad">HELLO, WORLD. I'M</text>

  <!-- main name -->
  <text x="600" y="196" text-anchor="middle" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="78" font-weight="800" letter-spacing="3" fill="url(#neon)" filter="url(#glow)">MOHAMMED QURAAN</text>

  <!-- subtitle -->
  <text x="600" y="238" text-anchor="middle" font-family="'Fira Code', Consolas, monospace" font-size="19" fill="#c9d1d9">
    <tspan fill="#00f5ff">~/developer</tspan><tspan fill="#ff2bd6">$ </tspan>learning &#8226; building &#8226; committing
    <animate attributeName="opacity" values="1;0.75;1" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- skill pills -->
  <g font-family="'Fira Code', Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle">
    <g>
      <rect x="272" y="258" width="74" height="26" rx="13" fill="#00f5ff" fill-opacity="0.10" stroke="#00f5ff" stroke-opacity="0.55"/>
      <text x="309" y="276" fill="#00f5ff">C</text>
    </g>
    <g>
      <rect x="354" y="258" width="82" height="26" rx="13" fill="#00f5ff" fill-opacity="0.10" stroke="#00f5ff" stroke-opacity="0.55"/>
      <text x="395" y="276" fill="#00f5ff">C++</text>
    </g>
    <g>
      <rect x="444" y="258" width="82" height="26" rx="13" fill="#ff2bd6" fill-opacity="0.10" stroke="#ff2bd6" stroke-opacity="0.55"/>
      <text x="485" y="276" fill="#ff2bd6">JAVA</text>
    </g>
    <g>
      <rect x="534" y="258" width="100" height="26" rx="13" fill="#ff2bd6" fill-opacity="0.10" stroke="#ff2bd6" stroke-opacity="0.55"/>
      <text x="584" y="276" fill="#ff2bd6">PYTHON</text>
    </g>
    <g>
      <rect x="642" y="258" width="130" height="26" rx="13" fill="#8b5cf6" fill-opacity="0.12" stroke="#8b5cf6" stroke-opacity="0.6"/>
      <text x="707" y="276" fill="#b79cff">JAVASCRIPT</text>
    </g>
    <g>
      <rect x="780" y="258" width="70" height="26" rx="13" fill="#00f5ff" fill-opacity="0.10" stroke="#00f5ff" stroke-opacity="0.55"/>
      <text x="815" y="276" fill="#00f5ff">CSS</text>
    </g>
    <g>
      <rect x="858" y="258" width="70" height="26" rx="13" fill="#c9d1d9" fill-opacity="0.08" stroke="#c9d1d9" stroke-opacity="0.45"/>
      <text x="893" y="276" fill="#c9d1d9">GIT</text>
    </g>
  </g>

  <!-- blinking cursor -->
  <rect x="985" y="225" width="11" height="21" fill="#00f5ff" filter="url(#softGlow)">
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- floating sparks -->
  <g fill="#00f5ff">
    <circle cx="90" cy="140" r="2.5">
      <animate attributeName="cy" values="140;110;140" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1115" cy="105" r="2">
      <animate attributeName="cy" values="105;135;105" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
